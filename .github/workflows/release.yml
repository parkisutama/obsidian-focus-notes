name: Release Obsidian plugin

on:
  push:
    tags:
      - "*.*.*"

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "24.x"
          cache: pnpm

      - name: Enable pnpm
        run: corepack enable

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify semver tag matches manifest version
        run: |
          TAG="${GITHUB_REF#refs/tags/}"
          MANIFEST_VERSION="$(node -p "require('./manifest.json').version")"

          if ! echo "$TAG" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "Release tag ($TAG) must be semver without a v prefix."
            exit 1
          fi

          if [ "$TAG" != "$MANIFEST_VERSION" ]; then
            echo "Release tag ($TAG) must match manifest.json version ($MANIFEST_VERSION)."
            exit 1
          fi

      - name: Check and build plugin
        run: pnpm run check:ci

      - name: Package plugin zip
        run: pnpm run package:plugin

      - name: Create or update GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            manifest.json
            main.js
            styles.css
            focus-notes.zip
          fail_on_unmatched_files: true
          make_latest: true
